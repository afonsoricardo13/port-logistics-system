name: VM Deployment and Test Plan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Runs every day at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${{ github.workspace }}/.dotnet

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          global-json-file: global.json
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

      - name: Display .NET version
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore apps/port-logistics/backend/PortLogistics.sln

      - name: Build (Release)
        run: dotnet build apps/port-logistics/backend/PortLogistics.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test apps/port-logistics/backend/PortLogistics.sln --configuration Release --no-build --logger "trx" --collect "XPlat Code Coverage"

      - name: Publish application
        run: dotnet publish apps/port-logistics/backend/WebApi/WebApi.csproj --configuration Release --no-build --output ./publish

      - name: Create deployment package
        run: |
          cd publish
          tar -czf ../portlogistics-deploy.tar.gz *
          cd ..

